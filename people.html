<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>People — Yuan Liu</title>
  <link rel="stylesheet" href="../../styles.css" />
</head>

<body class="page-people">

<nav class="top-nav">
    <a href="../../index.html">home</a>
</nav>
  <main class="people-wrap" id="peopleGrid">
    <img src="people-01.jpg" alt="People">
    <img src="people-02.jpg" alt="People">
    <img src="people-03.jpg" alt="People">
    <img src="people-04.jpg" alt="People">
    <img src="people-05.jpg" alt="People">
    <img src="people-06.jpg" alt="People">
    <img src="people-07.jpg" alt="People">
    <img src="people-08.jpg" alt="People">
    <img src="people-09.jpg" alt="People">
    <img src="people-10.jpg" alt="People">
    <img src="people-11.jpg" alt="People">
    <img src="people-12.jpg" alt="People">
  </main>

  <div class="people-lightbox" id="lightbox">
    <button class="lightbox-close" id="closeBtn">Close</button>
    <button class="lightbox-prev" id="prevBtn">Prev</button>

    <figure class="lightbox-figure">
      <img id="lightboxImage" src="" alt="People">
      <figcaption>
        <div>People</div>
        <div id="counter"></div>
      </figcaption>
    </figure>

    <button class="lightbox-next" id="nextBtn">Next</button>
  </div>

  <script>
    const images = Array.from(document.querySelectorAll(".people-wrap img"));
    const grid = document.getElementById("peopleGrid");
    const lightbox = document.getElementById("lightbox");
    const lightboxImage = document.getElementById("lightboxImage");
    const counter = document.getElementById("counter");
    const closeBtn = document.getElementById("closeBtn");
    const nextBtn = document.getElementById("nextBtn");
    const prevBtn = document.getElementById("prevBtn");

    let index = 0;

    function openLightbox(i) {
      index = i;
      lightboxImage.src = images[index].src;
      counter.textContent = `${index + 1} of ${images.length}`;
      lightbox.classList.add("is-open");
      grid.classList.add("is-blurred");
    }

    function closeLightbox() {
      lightbox.classList.remove("is-open");
      grid.classList.remove("is-blurred");
    }

    function show(i) {
      index = (i + images.length) % images.length;
      lightboxImage.src = images[index].src;
      counter.textContent = `${index + 1} of ${images.length}`;
    }

    images.forEach((img, i) => {
      img.addEventListener("click", () => openLightbox(i));
    });

    closeBtn.addEventListener("click", closeLightbox);
    nextBtn.addEventListener("click", () => show(index + 1));
    prevBtn.addEventListener("click", () => show(index - 1));

    window.addEventListener("keydown", (e) => {
      if (!lightbox.classList.contains("is-open")) return;
      if (e.key === "Escape") closeLightbox();
      if (e.key === "ArrowRight") show(index + 1);
      if (e.key === "ArrowLeft") show(index - 1);
    });
  </script>

</body>
</html>
