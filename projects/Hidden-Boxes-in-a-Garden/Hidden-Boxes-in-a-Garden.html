<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Hidden Boxes in a Garden — Yuan Liu</title>
  <link rel="stylesheet" href="../../styles.css" />
</head>

<body class="page-work page-hidden-boxes">

  <nav class="top-nav">
    <a href="../../index.html">home</a>
  </nav>

  <main class="work-wrap">
    <div class="work-stage">
      <div class="work-track">

        <section class="work-panel image-panel">
          <figure class="work-figure">
            <img
              id="projectImage"
              class="work-img"
              src="Forgotten-Flowers.JPG"
              alt="Hidden Boxes in a Garden"
            />
          </figure>
        </section>

        <section class="work-panel video-panel">
         
            <div class="video-frame-wrap">
  <iframe
    src="https://player.vimeo.com/video/1206041581"
    class="video-frame"
    frameborder="0"
    allow="autoplay; fullscreen; picture-in-picture"
    allowfullscreen>
  </iframe>
</div>
          </div>
        </section>

      </div>
    </div>

    <figcaption class="work-caption">
  <div class="work-title">Hidden Boxes in a Garden</div>
  <div class="work-meta">
    April 24th – May 7th, 2026<br>
    The Reef LA
  </div>
</figcaption>
  </main>

  <script>
    const images = [
      "Forgotten-Flowers.JPG",
      "Hidden-Room.JPG",
      "Rock-Fountain.JPG"
    ];

    let index = 0;
    const img = document.getElementById("projectImage");

    function show(i) {
      index = (i + images.length) % images.length;
      img.src = images[index];
    }

    img.addEventListener("click", () => show(index + 1));

    window.addEventListener("keydown", (e) => {
      if (e.key === "ArrowRight") show(index + 1);
      if (e.key === "ArrowLeft") show(index - 1);
    });
  </script>

</body>
</html>
