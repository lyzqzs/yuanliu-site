<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>People — Yuan Liu</title>
  <link rel="stylesheet" href="../styles.css" />
</head>

<body class="page-people">

  <nav class="top-nav">
    <a href="../index.html">home</a>
  </nav>

  <main class="people-wrap" id="peopleGrid"></main>

  <div class="people-lightbox" id="lightbox">
    <img id="lightboxImage" src="" alt="People">
  </div>

  <script>
    const totalImages = 188;
    const targetRowHeight = 145;

    let gap = 48;

    const grid = document.getElementById("peopleGrid");
    const lightbox = document.getElementById("lightbox");
    const lightboxImage = document.getElementById("lightboxImage");

    function fileName(n){
      return `people-${n}.jpg`;
    }

    let imageNumbers = Array.from({ length: totalImages }, (_, i) => i + 1);

    // fixed random order
    imageNumbers = imageNumbers
      .map(value => ({ value, sort: Math.sin(value * 999) }))
      .sort((a, b) => a.sort - b.sort)
      .map(item => item.value);

    let images = [];

    function makeImg(num, index){
      return new Promise(resolve => {
        const img = new Image();
        img.src = fileName(num);
        img.alt = "People";
        img.loading = "lazy";
        img.dataset.index = index;

        img.onload = () => {
          images[index] = img;
          resolve({
            img,
            ratio: img.naturalWidth / img.naturalHeight
          });
        };

        img.onerror = () => resolve(null);
      });
    }

    function layout(items){
      grid.innerHTML = "";

      gap = window.innerWidth <= 900 ? 28 : 48;

      const gridWidth = grid.clientWidth - 4;

      let row = [];
      let rowRatio = 0;

      function addRow(rowItems, isLast){
        const rowEl = document.createElement("div");
        rowEl.className = "people-row";

        const totalGap = gap * (rowItems.length - 1);
        let rowHeight = (gridWidth - totalGap) / rowItems.reduce((s, item) => s + item.ratio, 0);

        if(isLast){
          rowHeight = targetRowHeight;
          rowEl.classList.add("is-last");
        }

        rowHeight = Math.floor(rowHeight);

        rowItems.forEach(item => {
          const img = item.img;
          img.style.height = `${rowHeight}px`;
          img.style.width = `${Math.floor(rowHeight * item.ratio)}px`;
          rowEl.appendChild(img);
        });

        grid.appendChild(rowEl);
      }

      items.forEach(item => {
        row.push(item);
        rowRatio += item.ratio;

        const predictedWidth = rowRatio * targetRowHeight + gap * (row.length - 1);

        if(predictedWidth >= gridWidth){
          addRow(row, false);
          row = [];
          rowRatio = 0;
        }
      });

      if(row.length) addRow(row, true);
    }

    Promise.all(imageNumbers.map((num, i) => makeImg(num, i))).then(results => {
      const loaded = results.filter(Boolean);
      layout(loaded);

      images = loaded.map(item => item.img);

      images.forEach((img, i) => {
        img.dataset.index = i;
        img.addEventListener("click", () => openLightbox(i));
      });

      window.addEventListener("resize", () => layout(loaded));
    });

    let index = 0;

    function openLightbox(i) {
      index = i;
      lightboxImage.src = images[index].src;
      lightbox.classList.add("is-open");
      grid.classList.add("is-blurred");
    }

    function closeLightbox() {
      lightbox.classList.remove("is-open");
      grid.classList.remove("is-blurred");
      lightboxImage.src = "";
    }

    function show(i) {
      index = (i + images.length) % images.length;
      lightboxImage.src = images[index].src;
    }

    lightbox.addEventListener("click", closeLightbox);

    window.addEventListener("keydown", (e) => {
      if (!lightbox.classList.contains("is-open")) return;

      if (e.key === "Escape") closeLightbox();
      if (e.key === "ArrowRight") show(index + 1);
      if (e.key === "ArrowLeft") show(index - 1);
    });
  </script>

</body>
</html>
