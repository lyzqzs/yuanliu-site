<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>People — Yuan Liu</title>
  <link rel="stylesheet" href="../styles.css" />
</head>

<body class="page-people">

  <nav class="top-nav">
    <a href="../index.html">home</a>
  </nav>

  <main class="people-wrap" id="peopleGrid"></main>

  <div class="people-lightbox" id="lightbox">
    <img id="lightboxImage" src="" alt="People">
  </div>

  <script>
    const totalImages = 188;
    const targetRowHeight = 145;

    let gap = 48;

    const grid = document.getElementById("peopleGrid");
    const lightbox = document.getElementById("lightbox");
    const lightboxImage = document.getElementById("lightboxImage");

    function fileName(n){
      return `people-${n}.jpg`;
    }

    let imageNumbers = Array.from({ length: totalImages }, (_, i) => i + 1);

    function seededRandom(seed){
  const x = Math.sin(seed * 9999) * 10000;
  return x - Math.floor(x);
}

imageNumbers = imageNumbers
  .map(value => ({
    value,
    group: value % 17,
    random: seededRandom(value)
  }))
  .sort((a, b) => {
    if(a.group !== b.group) return a.group - b.group;
    return a.random - b.random;
  })
  .map(item => item.value);

    let images = [];

    function makeImg(num, index){
      return new Promise(resolve => {
        const img = new Image();
        img.src = fileName(num);
        img.alt = "People";
        img.loading = "lazy";
        img.dataset.index = index;

        img.onload = () => {
          images[index] = img;
          resolve({
            img,
            ratio: img.naturalWidth / img.naturalHeight
          });
        };

        img.onerror = () => resolve(null);
      });
    }

    function getGridWidth(){
      const style = getComputedStyle(grid);

      return grid.clientWidth
        - parseFloat(style.paddingLeft)
        - parseFloat(style.paddingRight)
        - 4;
    }

    function layout(items){
      grid.innerHTML = "";

      gap = window.innerWidth <= 900 ? 28 : 48;

      const gridWidth = getGridWidth();

      let row = [];
      let rowRatio = 0;

      function addRow(rowItems, isLast){
        const rowEl = document.createElement("div");
        rowEl.className = "people-row";

        const totalGap = gap * (rowItems.length - 1);
        let rowHeight =
          (gridWidth - totalGap) /
          rowItems.reduce((s, item) => s + item.ratio, 0);

        if(isLast){
          rowHeight = targetRowHeight;
          rowEl.classList.add("is-last");
        }

        rowHeight = Math.floor(rowHeight);

        rowItems.forEach(item => {
          const img = item.img;
          img.style.height = `${rowHeight}px`;
          img.style.width = `${Math.floor(rowHeight * item.ratio)}px`;
          rowEl.appendChild(img);
        });

        grid.appendChild(rowEl);
      }

      items.forEach(item => {
        row.push(item);
        rowRatio += item.ratio;

        const predictedWidth =
          rowRatio * targetRowHeight +
          gap * (row.length - 1);

        if(predictedWidth >= gridWidth){
          addRow(row, false);
          row = [];
          rowRatio = 0;
        }
      });

      if(row.length) addRow(row, true);
    }

    Promise.all(imageNumbers.map((num, i) => makeImg(num, i))).then(results => {
      const loaded = results.filter(Boolean);
      layout(loaded);

      images = loaded.map(item => item.img);

      let touchStartX = 0;
let touchStartY = 0;

images.forEach((img, i) => {

  img.dataset.index = i;

  // 手机开始触摸
  img.addEventListener("touchstart", (e) => {
    touchStartX = e.touches[0].clientX;
    touchStartY = e.touches[0].clientY;
  }, { passive: true });

  // 手机结束触摸
  img.addEventListener("touchend", (e) => {

    const dx = Math.abs(e.changedTouches[0].clientX - touchStartX);
    const dy = Math.abs(e.changedTouches[0].clientY - touchStartY);

    // 手指移动超过12px认为是在滚动，不打开图片
    if(dx < 12 && dy < 12){
      openLightbox(i);
    }

  });

  // 桌面端点击
  img.addEventListener("click", (e) => {

    // 手机上忽略 click（touchend 已经处理）
    if(window.matchMedia("(pointer: coarse)").matches){
      e.preventDefault();
      return;
    }

    openLightbox(i);

  });

});

      window.addEventListener("resize", () => {
        clearTimeout(window.peopleResizeTimer);
        window.peopleResizeTimer = setTimeout(() => layout(loaded), 150);
      });
    });

    let index = 0;

    function openLightbox(i){
      index = i;
      lightboxImage.src = images[index].src;
      lightbox.classList.add("is-open");
      grid.classList.add("is-blurred");
    }

    function closeLightbox(){
      lightbox.classList.remove("is-open");
      grid.classList.remove("is-blurred");
      lightboxImage.src = "";
    }

    function show(i){
      index = (i + images.length) % images.length;
      lightboxImage.src = images[index].src;
    }

    lightbox.addEventListener("click", closeLightbox);

    window.addEventListener("keydown", (e) => {
      if(!lightbox.classList.contains("is-open")) return;

      if(e.key === "Escape") closeLightbox();
      if(e.key === "ArrowRight") show(index + 1);
      if(e.key === "ArrowLeft") show(index - 1);
    });
  </script>

</body>
</html>
