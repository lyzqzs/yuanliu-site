<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>People — Yuan Liu</title>
  <link rel="stylesheet" href="../styles.css" />
</head>

<body class="page-people">

  <nav class="top-nav">
    <a href="../index.html">home</a>
  </nav>

  <main class="people-wrap" id="peopleGrid"></main>

  <div class="people-lightbox" id="lightbox">
    <img id="lightboxImage" src="" alt="People">
  </div>

  <script>
    const totalImages = 188;

    const grid = document.getElementById("peopleGrid");
    const lightbox = document.getElementById("lightbox");
    const lightboxImage = document.getElementById("lightboxImage");

    function fileName(n){
      return n < 10 ? `people-0${n}.jpg` : `people-${n}.jpg`;
    }

    let imageNumbers = Array.from({ length: totalImages }, (_, i) => i + 1);

    // fixed random order
    imageNumbers = imageNumbers
      .map(value => ({ value, sort: Math.sin(value * 999) }))
      .sort((a, b) => a.sort - b.sort)
      .map(item => item.value);

    const images = imageNumbers.map((num, i) => {
      const img = document.createElement("img");
      img.src = fileName(num);
      img.alt = "People";
      img.loading = "lazy";
      img.dataset.index = i;
      grid.appendChild(img);
      return img;
    });

    let index = 0;

    function openLightbox(i) {
      index = i;
      lightboxImage.src = images[index].src;
      lightbox.classList.add("is-open");
      grid.classList.add("is-blurred");
    }

    function closeLightbox() {
      lightbox.classList.remove("is-open");
      grid.classList.remove("is-blurred");
      lightboxImage.src = "";
    }

    function show(i) {
      index = (i + images.length) % images.length;
      lightboxImage.src = images[index].src;
    }

    images.forEach((img, i) => {
      img.addEventListener("click", () => openLightbox(i));
    });

    lightbox.addEventListener("click", closeLightbox);

    window.addEventListener("keydown", (e) => {
      if (!lightbox.classList.contains("is-open")) return;

      if (e.key === "Escape") closeLightbox();
      if (e.key === "ArrowRight") show(index + 1);
      if (e.key === "ArrowLeft") show(index - 1);
    });
  </script>

</body>
</html>
